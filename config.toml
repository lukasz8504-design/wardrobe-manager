[OVEN]
# Liczba półek w piecu
num_shelves = 3

# Liczba rzędów na jednej półce
num_rows = 1

# Liczba kolumn na jednej półce
num_columns = 3

# Liczba pozycji JIG w każdej sekcji
jigs_per_section = 2

[TIMER]
# Czas początkowy w minutach
initial_time = 100

# Czas rozpoczęcia pomarańczowego tła (w minutach)
orange_threshold = 5

# Czas rozpoczęcia czerwonego tła (w minutach)
red_threshold = 1

[COLORS]
# Kolor dla normalnego stanu (RGB w formacie hex)
normal_bg = "#f0f0f0"

# Kolor dla stanu pomarańczowego (ostrzeżenie)
orange_bg = "#FFA500"

# Kolor dla stanu czerwonego (krytyczny)
red_bg = "#FF0000"

# Kolor tekstu w stanie normalnym
normal_text = "#000000"

# Kolor tekstu w stanie pomarańczowym
orange_text = "#000000"

# Kolor tekstu w stanie czerwonym
red_text = "#FFFFFF"

# Kolor tła i tekstu wolnej pozycji
empty_bg = "#FFFFFF"
empty_text = "#000000"

# Kolory migania pozycji JIG ze skończonym czasem
blink_red_bg = "#FF0000"
blink_orange_bg = "#FFA500"
blink_text = "#FFFFFF"

[APPLICATION]
# Kolor tła całego okna aplikacji
background_color = "#FFFFFF"

[APPEARANCE]
# Szerokość przycisku JIG w znakach
jig_width = 8

# Wysokość przycisku JIG w liniach
jig_height = 2

# Domyślny rozmiar czcionki JIG
jig_font_size = 10

[JIG_DISPLAY]
jig_number_color = "#000000"
jig_number_font_size = 10
remaining_time_color = "#000000"
remaining_time_font_size = 10
processing_text = "W trakcie wygrzewania"
processing_text_color = "#000000"
processing_text_font_size = 8
not_removed_text = "NOT REMOVED"
not_removed_text_color = "#FFFFFF"
not_removed_text_font_size = 8

[OVEN_TITLE]
# Nazwa wyświetlana nad wszystkimi półkami
text = "DRY-001"
color = "#000000"
font_size = 10

[SHELF_LABELS]
shelf_1 = "SHELF 1"
shelf_2 = "SHELF 2"
shelf_3 = "SHELF 3"
color = "#000000"
font_size = 10

[ALERTS]
# Ostrzeżenie po zeskanowaniu nowego JIG-a, gdy istniejący JIG ma mniej czasu
near_expiry_seconds = 60

# Czas w milisekundach między kolorami migającego wygasłego JIG-a
blink_interval_ms = 500

[SOUNDS]
# Ścieżki do plików WAV; pusta wartość wyłącza dany dźwięk
empty_sound_file = ""
occupied_sound_file = ""
expired_sound_file = ""

[FILES]
# Ścieżka do pliku historii
history_file = "history.txt"

# Ścieżka do pliku danych o stanie pieca
state_file = "oven_state.json"
