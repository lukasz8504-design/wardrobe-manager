[WARDROBE]
# Liczba półek w szafie
num_shelves = 3

# Liczba wierszy (rzędów) na jednej półce
num_rows = 1

# Liczba kolumn na jednej półce (zawsze 1 - kwadraty są ustawione jeden nad drugim)
num_columns = 3

# Liczba kwadratów w każdej części (ćwiartce) półki (2 - jeden nad drugim)
squares_per_section = 2

[TIMER]
# Czas początkowy w minutach
initial_time = 100

# Czas rozpoczęcia pomarańczowego tła (w minutach)
orange_threshold = 5

# Czas rozpoczęcia czerwonego tła (w minutach)
red_threshold = 1

[COLORS]
# Kolor dla normalnego stanu (RGB w formacie hex)
normal_bg = #f0f0f0

# Kolor dla stanu pomarańczowego (ostrzeżenie)
orange_bg = #FFA500

# Kolor dla stanu czerwonego (krytyczny)
red_bg = #FF0000

# Kolor tekstu w stanie normalnym
normal_text = #000000

# Kolor tekstu w stanie pomarańczowym
orange_text = #000000

# Kolor tekstu w stanie czerwonym
red_text = #FFFFFF

# Kolor tła i tekstu wolnej pozycji
empty_bg = #FFFFFF
empty_text = #000000

# Kolory migania pozycji JIG ze skończonym czasem
blink_red_bg = #FF0000
blink_orange_bg = #FFA500
blink_text = #FFFFFF

[APPEARANCE]
# Rozmiar przycisku kwadratu (szerokość w znakach)
square_width = 8

# Rozmiar przycisku kwadratu (wysokość w linijkach)
square_height = 2

# Rozmiar czcionki dla numerów kwadratów
square_font_size = 10

[WARDROBE_TITLE]
# Nazwa wyświetlana nad wszystkimi półkami
text = DRY-001
color = #000000
font_size = 10

[ALERTS]
# Ostrzeżenie po zeskanowaniu nowego JIG-a, gdy istniejący JIG ma mniej czasu
near_expiry_seconds = 60

# Czas w milisekundach między kolorami migającego wygasłego JIG-a
blink_interval_ms = 500

[SOUNDS]
# Ścieżki do plików WAV; pusta wartość wyłącza dany dźwięk
empty_sound_file =
occupied_sound_file =
expired_sound_file =

[FILES]
# Ścieżka do pliku historii
history_file = history.txt

# Ścieżka do pliku danych o stanie szafy
state_file = wardrobe_state.json
