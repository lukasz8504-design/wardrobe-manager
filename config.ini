[WARDROBE]
# Liczba półek w szafie
num_shelves = 3

# Liczba wierszy (rzędów) na jednej półce
num_rows = 3

# Liczba kolumn na jednej półce
num_columns = 3

# Liczba kwadratów w każdej części (ćwiartce) półki
squares_per_section = 2

[TIMER]
# Czas początkowy w minutach
initial_time = 100

# Czas rozpoczęcia pomarańczowego tła (w minutach)
orange_threshold = 5

# Czas rozpoczęcia czerwonego tła (w minutach)
red_threshold = 1

[COLORS]
# Kolor dla normalnego stanu (RGB w formacie hex)
normal_bg = #f0f0f0

# Kolor dla stanu pomarańczowego (ostrzeżenie)
orange_bg = #FFA500

# Kolor dla stanu czerwonego (krytyczny)
red_bg = #FF0000

# Kolor tekstu w stanie normalnym
normal_text = #000000

# Kolor tekstu w stanie pomarańczowym
orange_text = #000000

# Kolor tekstu w stanie czerwonym
red_text = #FFFFFF

[APPEARANCE]
# Rozmiar okna (szerokość x wysokość)
window_width = 1400
window_height = 900

# Rozmiar przycisku (szerokość x wysokość)
button_width = 80
button_height = 80

# Rozmiar czcionki dla timera
timer_font_size = 48

# Rozmiar czcionki dla numerów kwadratów
square_font_size = 10

[FILES]
# Ścieżka do pliku historii
history_file = history.txt

# Ścieżka do pliku danych o stanie szafy
state_file = wardrobe_state.json
